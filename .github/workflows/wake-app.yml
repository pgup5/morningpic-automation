name: Morningpic browser check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: morningpic-browser-check
  cancel-in-progress: false

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open page and check wake button
        run: python wake_app.py

      - name: Save screenshot and page text
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: morningpic-result
          path: results/
          retention-days: 3
          if-no-files-found: warn
